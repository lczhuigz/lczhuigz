name: generate animation

on:
  # run automatically every 24 hours
  schedule:
    - cron: "0 */24 * * *"

  # allows running the job manually
  workflow_dispatch:

  # run on every push to main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Generates a snake animation from a GitHub user's contribution graph.
      # Replace YOUR_GITHUB_USERNAME with your GitHub username.
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: lczhuigz
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          # Create a repository secret named TOKEN in:
          # Settings > Secrets and variables > Actions
          # It should be a Personal Access Token with repo scope.
          # You can also use ${{ secrets.GITHUB_TOKEN }} instead.
          GITHUB_TOKEN: ${{ secrets.TOKEN }}

      # Pushes dist/ to the output branch, where the README loads the SVGs from.
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
